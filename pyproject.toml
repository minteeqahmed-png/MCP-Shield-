[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-shield"
version = "0.1.0"
description = "AI Agent and MCP Security Scanner. Protects local development environments by auditing Model Context Protocol configs, decoding hidden prompt injections, checking Python AST for dangerous execution, and enforcing supply chain hardening."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "minteeqahmed-png" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-security",
    "llm-security",
    "prompt-injection",
    "tool-poisoning",
    "cybersecurity",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
mcp-shield = "mcp_shield.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_shield*"]
