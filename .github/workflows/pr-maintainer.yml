name: AI Maintainer & PR Scorecard Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage-and-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run mcp-shield Self-Audit & Post PR Maintainer Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python -c "import pathlib, subprocess, tomllib; from mcp_shield.advanced_scanners import scan_python_ast; deps = tomllib.loads(pathlib.Path('pyproject.toml').read_text()).get('project', {}).get('dependencies', []); dep_s = 'Passed (dependencies = [])' if deps == [] else f'Failed ({deps})'; ast_f = [f for p in pathlib.Path('mcp_shield').rglob('*.py') for f in scan_python_ast(p.read_text(encoding='utf-8'), str(p))]; ast_s = 'Passed (0 AST sinks)' if not ast_f else f'Failed ({len(ast_f)} sinks)'; tp = subprocess.run(['python', '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_*.py'], capture_output=True); test_s = 'Passed all unit tests' if tp.returncode == 0 else 'Unit tests failed'; body = f'### 🤖 mcp-shield Automated Maintainer Gate\n\n| Security & Quality Gate | Status |\n| :--- | :--- |\n| **1. Zero-Dependency Lock** | {dep_s} |\n| **2. Source AST Safety** | {ast_s} |\n| **3. Unit Test Suite** | {test_s} |\n\n*Final merge requires approval from `@minteeqahmed-png` via `CODEOWNERS`.*'; pathlib.Path('pr_comment.md').write_text(body, encoding='utf-8')"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file pr_comment.md || true
