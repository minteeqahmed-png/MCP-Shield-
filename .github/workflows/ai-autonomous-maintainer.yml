name: Autonomous PR & Contributor Backlog Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-upgrade-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Codebase & Generate Improvement Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -c "import pathlib, re; p = pathlib.Path('mcp_shield/scanners.py'); t = p.read_text(encoding='utf-8'); rule = '    (\"SEC-009\", \"Hardcoded Hugging Face / Stripe API Token\", re.compile(r\"\\b(hf_[A-Za-z0-9]{30,}|sk_live_[0-9a-zA-Z]{24,})\\b\"), Severity.CRITICAL),\n'; (p.write_text(t.replace('SECRET_PATTERNS: List[Tuple[str, str, re.Pattern[str], Severity]] = [\n', 'SECRET_PATTERNS: List[Tuple[str, str, re.Pattern[str], Severity]] = [\n' + rule, 1), encoding='utf-8'), pathlib.Path('.pr_ready').write_text('SEC-009', encoding='utf-8')) if 'SEC-009' not in t else None"
          if [ -f .pr_ready ]; then
            rm .pr_ready
            BRANCH="ai-maintainer/add-sec-009-hf-stripe-tokens"
            git checkout -b "$BRANCH"
            git add mcp_shield/scanners.py
            git commit -m "feat(scanners): add SEC-009 Hugging Face and Stripe live token detection"
            git push origin "$BRANCH" --force
            gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "feat(scanners): add SEC-009 Hugging Face & Stripe token detection" --body "Automated AI Maintainer PR: adds SEC-009 to detect hardcoded Hugging Face (hf_...) and Stripe (sk_live_...) tokens. Ready for CodeRabbit review and community test contributions." || true
          fi
