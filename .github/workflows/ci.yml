name: mcp-shield PR Security & CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-security-gate:
    name: pr-security-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Zero External Runtime Dependencies (Supply-Chain Lock)
        run: |
          python -c "import tomllib, pathlib, sys; data = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); deps = data.get('project', {}).get('dependencies', []); sys.exit(0 if deps == [] else f'Blocked: external dependencies are not allowed: {deps}')"
      - name: Verify AST Safety of mcp_shield Source Code
        run: |
          python -c "from pathlib import Path; from mcp_shield.advanced_scanners import scan_python_ast; import sys; findings = [f for p in Path('mcp_shield').rglob('*.py') for f in scan_python_ast(p.read_text(encoding='utf-8'), str(p))]; print(f'AST findings in mcp_shield/: {len(findings)}'); sys.exit(1 if findings else 0)"
      - name: Run Unit Test Suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run Built-in Vulnerability Demo & SARIF Generation
        run: python -m mcp_shield demo --html demo_scorecard.html --sarif demo_results.sarif

  matrix-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
